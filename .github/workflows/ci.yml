name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: FinOps tests + API contract
    runs-on: [self-hosted, linux, x64, hostinger-vps]
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile
        run: python3 -m compileall -q .
      - name: Unit, HTTP and contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify CLI audit preset
        run: "python3 finops_agent.py audit --preset perfops-estate --db :memory: > /dev/null"

